const firebaseConfig = {
  apiKey: "AIzaSyAcnG084YsCM6sXosXUp4sIvQI77WXMOOE",

  projectId: "flashcardquiz-48db8",

  messagingSenderId: "495479281928",
  appId: "1:495479281928:web:f742c910b282e83cfd74bd",
  measurementId: "G-GB5SLNVQSW"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const firestore = getFirestore(firebaseApp);
/* =========================================================
   FLASHCARD QUIZ — full client-side app
   "Database" = localStorage (per browser). AI generation uses
   the Claude "sample" runtime capability when available, with
   a rule-based fallback so quiz creation always works.
========================================================= */

/* ---------------- storage helpers ---------------- */
const DB_KEYS = { USERS:'fq_users', SESSION:'fq_session', QUIZZES:'fq_quizzes', DECKS:'fq_decks', HISTORY:'fq_history', THEME:'fq_theme', SETTINGS:'fq_settings' };
function dbGet(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : (fallback ?? null); }catch(e){ return fallback ?? null; } }
function dbSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return 'h'+h; }

function getUsers(){ return dbGet(DB_KEYS.USERS, []); }
function saveUsers(u){ dbSet(DB_KEYS.USERS, u); }
function getSession(){ return dbGet(DB_KEYS.SESSION, null); }
function setSession(userId){ if(userId){ localStorage.setItem('fq_firebase_uid',userId); }else{ localStorage.removeItem('fq_firebase_uid'); localStorage.removeItem('fq_firebase_profile'); } }
function currentUser(){ const uid = localStorage.getItem('fq_firebase_uid'); if(!uid) return null; const cached = dbGet('fq_firebase_profile', null); return cached && cached.uid===uid ? {...cached,id:uid} : (auth.currentUser ? {id:uid,uid:uid,name:auth.currentUser.displayName||auth.currentUser.email?.split('@')[0]||'User',email:auth.currentUser.email||''} : null); }
function getQuizzes(){ return dbGet(DB_KEYS.QUIZZES, []); }
function saveQuizzes(q){ dbSet(DB_KEYS.QUIZZES, q); }
function getDecks(){ return dbGet(DB_KEYS.DECKS, []); }
function saveDecks(d){ dbSet(DB_KEYS.DECKS, d); }
function getHistory(){ return dbGet(DB_KEYS.HISTORY, []); }
function saveHistory(h){ dbSet(DB_KEYS.HISTORY, h); }
function mySettings(){ return dbGet(DB_KEYS.SETTINGS, {emailNotif:true, quizReminders:false}); }
function saveSettings(s){ dbSet(DB_KEYS.SETTINGS, s); }

function myQuizzes(){ const u = currentUser(); if(!u) return []; return getQuizzes().filter(q=>q.ownerId===u.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); }
function myDecks(){ const u = currentUser(); if(!u) return []; return getDecks().filter(d=>d.ownerId===u.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); }
function myHistory(){ const u = currentUser(); if(!u) return []; return getHistory().filter(h=>h.ownerId===u.id).sort((a,b)=> new Date(b.date)-new Date(a.date)); }

/* ---------------- theme ---------------- */
function applyTheme(){ const t = dbGet(DB_KEYS.THEME,'system'); if(t==='light') document.documentElement.setAttribute('data-theme','light'); else if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); }
applyTheme();

/* ---------------- toast ---------------- */
let toastTimer=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2400); }

/* ---------------- router ---------------- */
function go(hash){ window.location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

/* ---------------- AI sample capability ---------------- */
let sampleFn = null, sampleTried = false;
async function getSampler(){
  if(sampleTried) return sampleFn;
  sampleTried = true;
  try{
    if(window.claude && window.claude.use){
      const s = await window.claude.use('sample');
      if(s) sampleFn = s;
    }
  }catch(e){ sampleFn = null; }
  return sampleFn;
}

/* ---------------- pptx text extraction ---------------- */
async function extractPptxText(file){
  const zip = await JSZip.loadAsync(file);
  const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  slideFiles.sort((a,b)=>{
    const na = parseInt(a.match(/slide(\d+)\.xml/)[1]), nb = parseInt(b.match(/slide(\d+)\.xml/)[1]);
    return na-nb;
  });
  const slides = [];
  for(const name of slideFiles){
    const xml = await zip.files[name].async('string');
    const texts = [...xml.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m=>m[1]);
    const joined = texts.join(' ').replace(/\s+/g,' ').trim();
    if(joined) slides.push(joined);
  }
  return slides;
}

/* ---------------- rule-based quiz generator (fallback) ---------------- */
const STOPWORDS = new Set(['the','a','an','is','are','was','were','of','in','on','at','to','for','and','or','with','by','as','that','this','it','be','from','which','their','its','has','have','had','will','can','also','into','than','these','those','such','not','but','all','more','most','other','some','then','so','if','because']);
function pickKeyword(sentence){
  const words = sentence.replace(/[^a-zA-Z0-9\s\-]/g,'').split(/\s+/).filter(w=>w.length>3 && !STOPWORDS.has(w.toLowerCase()));
  if(!words.length) return null;
  words.sort((a,b)=> b.length-a.length);
  return words[0];
}
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ruleBasedQuiz(slideTexts, count, difficulty){
  const allText = slideTexts.join(' ');
  const sentences = allText.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>25 && s.length<200);
  const allWords = [...new Set(allText.replace(/[^a-zA-Z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>4 && !STOPWORDS.has(w.toLowerCase())))];
  const questions = [];
  const used = new Set();
  for(const s of shuffleArr(sentences)){
    if(questions.length>=count) break;
    const kw = pickKeyword(s);
    if(!kw || used.has(kw.toLowerCase())) continue;
    used.add(kw.toLowerCase());
    const blanked = s.replace(new RegExp('\\b'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'_____');
    if(blanked===s) continue;
    let distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
    while(distractors.length<3) distractors.push('None of these');
    const options = shuffleArr([kw, ...distractors]);
    questions.push({ id:uid('q'), text:`Fill in the blank: "${blanked}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
  }
     // pad with slide-topic questions if not enough
  let i=0;
  while(questions.length<count && slideTexts.length){
    const t = slideTexts[i % slideTexts.length];
    const kw = pickKeyword(t);
    if(kw){
      const distractors = shuffleArr(allWords.filter(w=>w.toLowerCase()!==kw.toLowerCase())).slice(0,3);
      while(distractors.length<3) distractors.push('None of these');
      const options = shuffleArr([kw, ...distractors]);
      questions.push({ id:uid('q'), text:`Which term relates most to: "${t.slice(0,80)}${t.length>80?'…':''}"`, options, answerIndex: options.indexOf(kw), difficulty: difficulty||'Medium' });
    }
    i++;
    if(i>slideTexts.length*3) break;
  }
  return questions.slice(0,count);
                                    }

    async function aiGenerateQuiz(contextText, topic, count, difficulty){
  const sampler = await getSampler();
  if(!sampler) return null;
  const prompt = `You are a quiz generator for a flashcard/quiz study app. Based on the following material, generate exactly ${count} multiple-choice questions at ${difficulty||'Medium'} difficulty. Topic/context: ${topic||'(see material)'}.

MATERIAL:
"""${(contextText||'').slice(0,6000)}"""

Respond with ONLY a raw JSON array (no markdown fences, no commentary) where each item is:
{"text": "question text", "options": ["opt1","opt2","opt3","opt4"], "answerIndex": 0}
answerIndex is the 0-based index of the correct option in "options". Make questions clear and unambiguous, options plausible, only one correct answer.`;
  try{
    const res = await sampler(prompt, { modelTier:'default' });
    let txt = (res && res.text) ? res.text.trim() : '';
    txt = txt.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const jsonMatch = txt.match(/\[[\s\S]*\]/);
    const arr = JSON.parse(jsonMatch ? jsonMatch[0] : txt);
    return arr.map(q => ({ id:uid('q'), text:q.text, options:q.options, answerIndex:q.answerIndex, difficulty: difficulty||'Medium' })).filter(q=>q.text && Array.isArray(q.options) && q.options.length>=2);
  }catch(e){
    return null;
  }
}

function bindAuthHandlers(){

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inp = document.getElementById(btn.dataset.toggle);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    });
  });

  /* ================= LOGIN ================= */

  const lf = document.getElementById('loginForm');

  if(lf) lf.addEventListener('submit', async e=>{
    e.preventDefault();

    const identifier = document
      .getElementById('li_user')
      .value
      .trim()
      .toLowerCase();

    const pass = document.getElementById('li_pass').value;
    const msg = document.getElementById('authMsg');

    msg.innerHTML = `<div class="ok-msg">Logging in...</div>`;

    try{

      let email = identifier;

      /* Login using username */
      if(!identifier.includes('@')){

        const q = query(
          collection(firestore, 'users'),
          where('usernameLower', '==', identifier)
        );

        const snapshot = await getDocs(q);

        if(snapshot.empty){
          msg.innerHTML =
            `<div class="err-msg">Username not found.</div>`;
          return;
        }

        email = snapshot.docs[0].data().email;
      }

      const credential =
        await signInWithEmailAndPassword(auth, email, pass);

      const user = credential.user;

      localStorage.setItem('fq_firebase_uid', user.uid);

      msg.innerHTML = '';

      toast('Welcome back!');

      go('/dashboard');

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">Incorrect username/email or password.</div>`;
    }

  });


  /* ================= REGISTER ================= */

  const rf = document.getElementById('registerForm');

  if(rf) rf.addEventListener('submit', async e=>{
    e.preventDefault();

    const name =
      document.getElementById('r_name').value.trim();

    const username =
      document.getElementById('r_user').value.trim();

    const email =
      document.getElementById('r_email').value.trim().toLowerCase();

    const pass =
      document.getElementById('r_pass').value;

    const pass2 =
      document.getElementById('r_pass2').value;

    const msg =
      document.getElementById('authMsg');

    if(pass !== pass2){
      msg.innerHTML =
        `<div class="err-msg">Passwords do not match.</div>`;
      return;
    }

    if(pass.length < 6){
      msg.innerHTML =
        `<div class="err-msg">Password must be at least 6 characters.</div>`;
      return;
    }

    if(username.length < 3){
      msg.innerHTML =
        `<div class="err-msg">Username must be at least 3 characters.</div>`;
      return;
    }

    msg.innerHTML =
      `<div class="ok-msg">Creating account...</div>`;

    try{

      /* Check username first */

      const usernameQuery = query(
        collection(firestore, 'users'),
        where('usernameLower', '==', username.toLowerCase())
      );

      const usernameSnapshot =
        await getDocs(usernameQuery);

      if(!usernameSnapshot.empty){

        msg.innerHTML =
          `<div class="err-msg">Username already taken.</div>`;

        return;
      }

      /* Create Firebase Authentication account */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          pass
        );

      const user = credential.user;

      /* Save profile in Firestore */

      await setDoc(
        doc(firestore, 'users', user.uid),
        {
          uid: user.uid,
          name: name,
          username: username,
          usernameLower: username.toLowerCase(),
          email: email,
          createdAt: new Date().toISOString()
        }
      );

      localStorage.setItem(
        'fq_firebase_uid',
        user.uid
      );

      msg.innerHTML = '';

      toast('Account created! Welcome to Flashcard Quiz.');

      go('/dashboard');

    }catch(error){

      console.error(error);

      let message =
        'Unable to create account.';

      if(error.code === 'auth/email-already-in-use'){
        message = 'Email is already registered.';
      }

      if(error.code === 'auth/invalid-email'){
        message = 'Invalid email address.';
      }

      if(error.code === 'auth/weak-password'){
        message = 'Password is too weak.';
      }

      msg.innerHTML =
        `<div class="err-msg">${message}</div>`;
    }

  });


  /* ================= FORGOT PASSWORD ================= */

  const ff = document.getElementById('forgotForm');

  if(ff) ff.addEventListener('submit', async e=>{
    e.preventDefault();

    const email =
      document.getElementById('f_email')
      .value
      .trim()
      .toLowerCase();

    const msg =
      document.getElementById('authMsg');

    const btn =
      document.getElementById('forgotBtn');

    try{

      await sendPasswordResetEmail(
        auth,
        email
      );

      msg.innerHTML =
        `<div class="ok-msg">
          Password reset link sent to your email.
        </div>`;

      btn.textContent = 'Reset Email Sent';

    }catch(error){

      console.error(error);

      msg.innerHTML =
        `<div class="err-msg">
          Unable to send reset email. Check the email address.
        </div>`;
    }

  });
}

async function handlePptFile(file){
  if(!/\.pptx$/i.test(file.name)){ toast('Please upload a .pptx file.'); return; }

  const infoWrap = document.getElementById('fileInfoWrap');

  </div>`;

    document.getElementById('pptProgress').style.width = '100%';
    document.getElementById('pptStatusIcon').textContent = '✅';
    document.getElementById('pptStatusText').textContent = `Extracted text from ${pptSlides.length} slide(s).`;

        <div class="form-row">
          <div class="field"><label>Number of Questions</label><input id="ppt_count" type="number" min="3" max="20" value="10"></div>

        </div>
        <p style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">This feature will try AI question generation; if unavailable, a topic-based generator is used instead.</p>
        <button class="btn btn-primary" id="genFromPptBtn">Generate Questions</button>
      </div>
      <div id="pptResultWrap" style="margin-top:16px;"></div>
    `;
    document.getElementById('genFromPptBtn').addEventListener('click', async ()=>{

      const diff = document.getElementById('ppt_diff').value;
      const btn = document.getElementById('genFromPptBtn');
      btn.disabled = true; btn.textContent = 'Generating…';
      const combined = pptSlides.join('\n');
      let questions = await aiGenerateQuiz(combined, pptFileName, count, diff);
      let source = 'ai';
      if(!questions || !questions.length){ questions = ruleBasedQuiz(pptSlides, count, diff); source='fallback'; }
      btn.disabled = false; btn.textContent = 'Generate Questions';

      document.getElementById('pptResultWrap').innerHTML = `
        <div class="card pad">
          <div class="section-title">Generated Questions (${questions.length}) ${source==='fallback'?'<span class="tag tag-medium">auto</span>':'<span class="tag tag-blue">AI</span>'}</div>
          ${questions.map((q,i)=>`<div class="q-card"><b>${i+1}. ${escapeHtml(q.text)}</b>
            ${q.options.map((o,idx)=>`<div class="quiz-opt ${idx===q.answerIndex?'correct':''}" style="cursor:default;"><span class="opt-letter">${String.fromCharCode(65+idx)}</span>${escapeHtml(o)}</div>`).join('')}
          </div>`).join('')}
          <button class="btn btn-primary" id="savePptQuizBtn">💾 Save Quiz</button>
        </div>`;
      document.getElementById('savePptQuizBtn').addEventListener('click', ()=>{
        const u = currentUser();
        const data = window.__pendingPptQuiz;
        const quizzes = getQuizzes();
        quizzes.push({ id:uid('quiz'), ownerId:u.id, title:data.title, subject:'From PowerPoint', description:`Generated from ${pptFileName}`, difficulty:diff, questions:data.questions, createdAt: nowISO(), source:'ppt' });
        saveQuizzes(quizzes);
        toast('Quiz saved!');
        go('/my-quizzes');
      });
    });
  }catch(e){
    document.getElementById('pptStatusIcon').textContent = '❌';

  }
}

function quizPlayView(quizId){
  const quiz = getQuizzes().find(q=>q.id===quizId);
  if(!quiz) return `<div class="empty"><p>Quiz not found.</p></div>`;
  if(!quizRuntime || quizRuntime.quiz.id !== quizId){
    quizRuntime = { quiz, index:0, answers: new Array(quiz.questions.length).fill(null), startedAt: Date.now() };
  }
  const q = quiz.questions[quizRuntime.index];
  const pct = Math.round(((quizRuntime.index)/quiz.questions.length)*100);
  return `
  <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div><h1>${escapeHtml(quiz.title)}</h1><p>Question ${quizRuntime.index+1} of ${quiz.questions.length}</p></div>
    <div style="text-align:right;"><span id="quizTimer" style="font-weight:700;">00:00</span></div>
  </div>
  <div class="progress-bar" style="margin-bottom:20px;"><div style="width:${pct}%"></div></div>
  <div class="card pad" style="max-width:680px;">
    <b style="font-size:17px;display:block;margin-bottom:16px;">${escapeHtml(q.text)}</b>
    <div id="optsWrap">
      ${q.options.map((o,i)=>`<div class="quiz-opt ${quizRuntime.answers[quizRuntime.index]===i?'selected':''}" data-oidx="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:18px;">
      <button class="btn btn-outline" id="prevBtn" style="width:auto;padding:10px 20px;" ${quizRuntime.index===0?'disabled':''}>← Previous</button>
      <button class="btn btn-primary" id="nextBtn" style="width:auto;padding:10px 20px;">${quizRuntime.index===quiz.questions.length-1?'Submit':'Next →'}</button>
    </div>
  </div>`;
}
function bindQuizPlayHandlers(){
  document.querySelectorAll('#optsWrap .quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      quizRuntime.answers[quizRuntime.index] = +el.dataset.oidx;
      document.querySelectorAll('#optsWrap .quiz-opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  const prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ quizRuntime.index--; render(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(quizRuntime.answers[quizRuntime.index]===null){ if(!confirm('No answer selected. Continue anyway?')) return; }
    if(quizRuntime.index < quizRuntime.quiz.questions.length-1){
      quizRuntime.index++;
      render();
    } else {
      finishQuiz();
    }
  });
  startQuizTimer();
}
function startQuizTimer(){
  clearInterval(quizTimerInt);
  const timerEl = document.getElementById('quizTimer');
  quizTimerInt = setInterval(()=>{
    if(!quizRuntime || !timerEl) { clearInterval(quizTimerInt); return; }
    const secs = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
    const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');
    const el = document.getElementById('quizTimer');
    if(el) el.textContent = `${m}:${s}`;
  }, 1000);
}
function finishQuiz(){
  clearInterval(quizTimerInt);
  const quiz = quizRuntime.quiz;
  let correct = 0;
  quiz.questions.forEach((q,i)=>{ if(quizRuntime.answers[i]===q.answerIndex) correct++; });
  const total = quiz.questions.length;
  const percentage = Math.round((correct/total)*100);
  const timeSpentSec = Math.floor((Date.now()-quizRuntime.startedAt)/1000);
  const u = currentUser();
  const attempt = { id:uid('att'), ownerId:u.id, quizId:quiz.id, quizTitle:quiz.title, date: nowISO(), correct, total, percentage, timeSpentSec, answers: quizRuntime.answers.slice() };
  const hist = getHistory(); hist.push(attempt); saveHistory(hist);
  window.__lastAttempt = attempt;
  go('/quiz-results');
}

      <b style="font-size:14px;">${escapeHtml(q.title)}</b>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 12px;">${q.questions.length} cards</p>
      <button class="btn btn-primary btn-sm" data-study-quiz="${q.id}" style="width:100%;">Study</button>
    </div>`).join('') || '<p style="color:var(--muted);font-size:13px;">No quizzes yet.</p>'}
  </div>
  <div class="section-title">My decks</div>
  <div class="grid grid-3">
    ${decks.map(d=>`<div class="card pad">
      <b style="font-size:14px;">${escapeHtml(d.title)}</b>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 12px;">${d.cards.length} cards</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" data-study-deck="${d.id}" style="flex:1;">Study</button>
        <button class="pill-btn" data-del-deck="${d.id}" style="color:var(--danger);">🗑</button>
      </div>
    </div>`).join('') || '<div class="card"><div class="empty"><div class="icon">🗂️</div><p>No custom decks yet. Create one!</p></div></div>'}
  </div>
  <div id="deckModalWrap"></div>
  `;
}
function bindFlashcardsListHandlers(){
  document.querySelectorAll('[data-study-quiz]').forEach(b=> b.addEventListener('click', ()=> go('/flashcards-study?quiz_'+b.dataset.studyQuiz)));
  document.querySelectorAll('[data-study-deck]').forEach(b=> b.addEventListener('click', ()=> go('/flashcards-study?deck_'+b.dataset.studyDeck)));
  document.querySelectorAll('[data-del-deck]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Delete this deck?')) return;
    saveDecks(getDecks().filter(d=>d.id!==b.dataset.delDeck));
    toast('Deck deleted.'); render();
  }));
  document.getElementById('newDeckBtn').addEventListener('click', openNewDeckModal);
}
let newDeckCards = [];
function openNewDeckModal(){
  newDeckCards = [{front:'',back:''}];
  const wrap = document.getElementById('deckModalWrap');
  wrap.innerHTML = `<div class="modal-bg" id="deckModalBg"><div class="modal" style="max-width:480px;max-height:82vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h3>New Flashcard Deck</h3><button class="icon-btn" id="closeDeckModal">✕</button></div>
    <div class="field"><label>Deck Title</label><input id="deck_title" placeholder="e.g. Biology Terms"></div>
    <div id="deckCardsWrap"></div>
    <button class="pill-btn" id="addCardBtn" style="margin-bottom:14px;">+ Add Card</button>
    <button class="btn btn-primary" id="saveDeckBtn">Save Deck</button>
  </div></div>`;
  renderDeckCards();
  document.getElementById('closeDeckModal').addEventListener('click', ()=> document.getElementById('deckModalWrap').innerHTML='');
  document.getElementById('deckModalBg').addEventListener('click', e=>{ if(e.target.id==='deckModalBg') document.getElementById('deckModalWrap').innerHTML=''; });
  document.getElementById('addCardBtn').addEventListener('click', ()=>{ newDeckCards.push({front:'',back:''}); renderDeckCards(); });
  document.getElementById('saveDeckBtn').addEventListener('click', ()=>{
    const title = document.getElementById('deck_title').value.trim();
    const cards = newDeckCards.filter(c=>c.front.trim() && c.back.trim()).map(c=>({id:uid('c'), front:c.front, back:c.back, known:false}));
    if(!title || !cards.length){ toast('Add a title and at least one complete card.'); return; }
    const u = currentUser();
    const decks = getDecks();
    decks.push({ id:uid('deck'), ownerId:u.id, title, cards, createdAt: nowISO() });
    saveDecks(decks);
    toast('Deck saved!');
    document.getElementById('deckModalWrap').innerHTML='';
    render();
  });
}
function renderDeckCards(){
  document.getElementById('deckCardsWrap').innerHTML = newDeckCards.map((c,i)=>`
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input data-i="${i}" data-side="front" value="${escapeHtml(c.front)}" placeholder="Front (question)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);">
      <input data-i="${i}" data-side="back" value="${escapeHtml(c.back)}" placeholder="Back (answer)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);">
    </div>`).join('');
  document.querySelectorAll('#deckCardsWrap input').forEach(inp=>{
    inp.addEventListener('input', e=>{ newDeckCards[+e.target.dataset.i][e.target.dataset.side] = e.target.value; });
  });
}

function flashcardsStudyView(param){
  let cards, title;
  if(param.startsWith('quiz_')){
    const quiz = getQuizzes().find(q=>q.id===param.slice(5));
    if(!quiz) return `<div class="empty"><p>Not found.</p></div>`;
    cards = quiz.questions.map(q=>({ id:q.id, front:q.text, back:q.options[q.answerIndex], known:false }));
    title = quiz.title;
  } else {
    const deck = getDecks().find(d=>d.id===param.slice(5));
    if(!deck) return `<div class="empty"><p>Not found.</p></div>`;
    cards = deck.cards;
    title = deck.title;
  }
  if(!deckRuntime || deckRuntime.key !== param){ deckRuntime = { key:param, cards:[...cards], index:0, flipped:false, title }; }
  const c = deckRuntime.cards[deckRuntime.index];
  return `
  <div class="page-head" style="display:flex;justify-content:space-between;align-items:center;">
    <div><h1>${escapeHtml(deckRuntime.title)}</h1><p>Card ${deckRuntime.index+1} of ${deckRuntime.cards.length}</p></div>
    <button class="pill-btn" onclick="go('/flashcards')">← Back</button>
  </div>
  <div class="flip-card ${deckRuntime.flipped?'flipped':''}" id="flipCard">
    <div class="flip-inner">
      <div class="flip-face flip-front">${escapeHtml(c.front)}</div>
      <div class="flip-face flip-back">${escapeHtml(c.back)}</div>
    </div>
  </div>
  <div style="display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap;">
    <button class="btn btn-outline" style="width:auto;padding:9px 16px;" id="fcPrev">← Previous</button>
    <button class="btn btn-primary" style="width:auto;padding:9px 16px;" id="fcFlip">🔄 Flip</button>
    <button class="btn btn-outline" style="width:auto;padding:9px 16px;" id="fcNext">Next →</button>
  </div>
  <div style="display:flex;justify-content:center;gap:10px;margin-top:10px;">
    <button class="pill-btn" id="fcShuffle">🔀 Shuffle</button>
    <button class="pill-btn" id="fcKnown">${c.known?'✅ Known':'☐ Mark Known'}</button>
  </div>`;
}
function bindFlashcardStudyHandlers(){
  document.getElementById('flipCard').addEventListener('click', ()=>{ deckRuntime.flipped = !deckRuntime.flipped; render(); });
  document.getElementById('fcFlip').addEventListener('click', (e)=>{ e.stopPropagation(); deckRuntime.flipped=!deckRuntime.flipped; render(); });
  document.getElementById('fcPrev').addEventListener('click', ()=>{ deckRuntime.index = (deckRuntime.index-1+deckRuntime.cards.length)%deckRuntime.cards.length; deckRuntime.flipped=false; render(); });
  document.getElementById('fcNext').addEventListener('click', ()=>{ deckRuntime.index = (deckRuntime.index+1)%deckRuntime.cards.length; deckRuntime.flipped=false; render(); });
  document.getElementById('fcShuffle').addEventListener('click', ()=>{ deckRuntime.cards = shuffleArr(deckRuntime.cards); deckRuntime.index=0; deckRuntime.flipped=false; toast('Shuffled!'); render(); });
  document.getElementById('fcKnown').addEventListener('click', ()=>{ deckRuntime.cards[deckRuntime.index].known = !deckRuntime.cards[deckRuntime.index].known; render(); });
}

/* ================= HISTORY ================= */
function historyView(){
  const hist = myHistory();
  if(!hist.length){
    return `<div class="page-head"><h1>Quiz History</h1><p>View your completed quizzes and performance.</p></div>
    <div class="card"><div class="empty"><div class="icon">🕘</div><p>No quiz history yet. Take a quiz to see it here!</p></div></div>`;
  }
  return `<div class="page-head"><h1>Quiz History</h1><p>View your completed quizzes and performance.</p></div>
  <div class="card pad wrap-x"><table>
  <tr><th>Quiz Title</th><th>Date</th><th>Score</th><th>Percentage</th><th>Correct</th><th></th></tr>
  ${hist.map(h=>`<tr>
    <td>${escapeHtml(h.quizTitle)}</td><td>${fmtDate(h.date)}</td><td>${h.correct}/${h.total}</td>
    <td><span class="tag ${h.percentage>=70?'tag-easy':h.percentage>=50?'tag-medium':'tag-hard'}">${h.percentage}%</span></td>
    <td>${h.correct}</td>
    <td><button class="pill-btn" onclick="go('/quiz-review?${h.quizId}__${h.id}')">Review</button></td>
  </tr>`).join('')}
  </table></div>`;
}

/* ================= PROFILE ================= */
function profileView(){
  const u = currentUser();
  const hist = myHistory();
  const avgScore = hist.length ? Math.round(hist.reduce((s,h)=>s+h.percentage,0)/hist.length) : 0;
  const initials = (u.name||'?').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  return `
  <div class="page-head"><h1>Profile</h1><p>Manage your personal information.</p></div>
  <div class="card pad" style="max-width:560px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <div class="avatar" style="width:64px;height:64px;font-size:22px;">${initials}</div>
      <div><b style="font-size:16px;">${escapeHtml(u.name)}</b><p style="font-size:12.5px;color:var(--muted);">@${escapeHtml(u.username)}</p></div>
    </div>
    <div class="field"><label>Full Name</label><input id="p_name" value="${escapeHtml(u.name)}"></div>
    <div class="field"><label>Username</label><input id="p_user" value="${escapeHtml(u.username)}"></div>
    <div class="field"><label>Email</label><input id="p_email" value="${escapeHtml(u.email)}"></div>
    <button class="btn btn-primary" id="saveProfileBtn" style="width:auto;padding:10px 18px;">Save Changes</button>
    <div class="nav-sep"></div>
    <div class="section-title">Change Password</div>
    <div class="field"><label>Current Password</label><input type="password" id="p_curpass"></div>
    <div class="field"><label>New Password</label><input type="password" id="p_newpass"></div>
    <button class="btn btn-outline" id="changePassBtn" style="width:auto;padding:10px 18px;">Change Password</button>
    <div class="nav-sep"></div>
    <div class="grid grid-3">
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${myQuizzes().length}</div><div class="lbl">Total Quizzes</div></div>
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${hist.length}</div><div class="lbl">Completed Quizzes</div></div>
      <div class="card pad" style="padding:12px;"><div class="num" style="font-size:18px;">${avgScore}%</div><div class="lbl">Average Score</div></div>
    </div>
  </div>`;
}
function bindProfileHandlers(){
  document.getElementById('saveProfileBtn').addEventListener('click', ()=>{
    const u = currentUser();
    const users = getUsers();
    const name = document.getElementById('p_name').value.trim();
    const username = document.getElementById('p_user').value.trim();
    const email = document.getElementById('p_email').value.trim();
    if(!name || !username || !email){ toast('All fields are required.'); return; }
    if(users.some(x=>x.id!==u.id && x.username.toLowerCase()===username.toLowerCase())){ toast('Username already taken.'); return; }
    const idx = users.findIndex(x=>x.id===u.id);
    users[idx] = {...users[idx], name, username, email };
    saveUsers(users);
    toast('Profile updated!');
    render();
  });
  document.getElementById('changePassBtn').addEventListener('click', ()=>{
    const u = currentUser();
    const cur = document.getElementById('p_curpass').value;
    const nw = document.getElementById('p_newpass').value;
    if(simpleHash(cur) !== u.password){ toast('Current password is incorrect.'); return; }
    if(nw.length<4){ toast('New password must be at least 4 characters.'); return; }
    const users = getUsers();
    const idx = users.findIndex(x=>x.id===u.id);
    users[idx].password = simpleHash(nw);
    saveUsers(users);
    toast('Password changed!');
    document.getElementById('p_curpass').value=''; document.getElementById('p_newpass').value='';
  });
}

/* ================= SETTINGS ================= */
function settingsView(){
  const s = mySettings();
  const theme = dbGet(DB_KEYS.THEME,'system');
  return `
  <div class="page-head"><h1>Settings</h1><p>Manage your account and preferences.</p></div>
  <div class="card pad" style="max-width:560px;">
    <div class="section-title">Notification Settings</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div><b style="font-size:13.5px;">Email Notifications</b><p style="font-size:12px;color:var(--muted);">Get notified about your quiz activity</p></div>
      <button class="toggle ${s.emailNotif?'on':''}" id="toggleEmail"><div class="knob"></div></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div><b style="font-size:13.5px;">Quiz Reminders</b><p style="font-size:12px;color:var(--muted);">Remind me to take quizzes</p></div>
      <button class="toggle ${s.quizReminders?'on':''}" id="toggleReminder"><div class="knob"></div></button>
    </div>
    <div class="nav-sep"></div>
    <div class="section-title">Theme Settings</div>
    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="pill-btn ${theme==='light'?'':''}" id="lightModeBtn" style="flex:1;${theme==='light'?'border-color:var(--primary);color:var(--primary);':''}">☀️ Light Mode</button>
      <button class="pill-btn" id="darkModeBtn" style="flex:1;${theme==='dark'?'border-color:var(--primary);color:var(--primary);':''}">🌙 Dark Mode</button>
    </div>
    <div class="nav-sep"></div>
    <button class="btn btn-danger" id="settingsLogoutBtn">🚪 Logout</button>
  </div>`;
}
function bindSettingsHandlers(){
  document.getElementById('toggleEmail').addEventListener('click', ()=>{ const s=mySettings(); s.emailNotif=!s.emailNotif; saveSettings(s); render(); });
  document.getElementById('toggleReminder').addEventListener('click', ()=>{ const s=mySettings(); s.quizReminders=!s.quizReminders; saveSettings(s); render(); });
  document.getElementById('lightModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'light'); applyTheme(); render(); });
  document.getElementById('darkModeBtn').addEventListener('click', ()=>{ dbSet(DB_KEYS.THEME,'dark'); applyTheme(); render(); });
  document.getElementById('settingsLogoutBtn').addEventListener('click', ()=>{ setSession(null); toast('Logged out.'); go('/login'); });
}

/* ================= PAGE HANDLER DISPATCH ================= */
function bindPageHandlers(path){
  const [p, param] = path.split('?');
  if(p==='/create-manual') bindManualQuizHandlers(param);
  else if(p==='/generate-ai') bindGenerateAiHandlers();
  else if(p==='/upload-ppt') bindUploadPptHandlers();
  else if(p==='/my-quizzes') bindMyQuizzesHandlers();
  else if(p==='/quiz-play') bindQuizPlayHandlers();
  else if(p==='/quiz-results') bindQuizResultsHandlers();
  else if(p==='/flashcards') bindFlashcardsListHandlers();
  else if(p==='/flashcards-study') bindFlashcardStudyHandlers();
  else if(p==='/profile') bindProfileHandlers();
  else if(p==='/settings') bindSettingsHandlers();
}
</script>
